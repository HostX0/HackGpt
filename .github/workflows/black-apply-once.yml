name: One-shot Black remediation

on:
  push:
    branches: [fix/review-readiness]
    paths: ['.github/workflows/black-apply-once.yml']

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.repository == 'HostX0/HackGpt' &&
      github.ref == 'refs/heads/fix/review-readiness' &&
      github.event.head_commit.message == 'chore(ci): apply exact Black formatting once'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-readiness
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the same formatter used by repository quality CI
        run: python -m pip install --disable-pip-version-check black
      - name: Format repository and verify Python syntax
        shell: bash
        run: |
          set -euo pipefail
          black .
          black --check .
          python -m compileall -q .
      - name: Remove one-shot workflow and publish formatting batch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/black-apply-once.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No formatting changes were produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply repository Black formatting'
          git push origin HEAD:fix/review-readiness
