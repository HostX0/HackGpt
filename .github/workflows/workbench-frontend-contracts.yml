name: Workbench Frontend Contracts

on:
  push:
    branches: [main, 'workbench/**']
    paths:
      - 'workbench/static/**'
      - 'workbench/tests/*.cjs'
      - '.github/workflows/workbench-frontend-contracts.yml'
  pull_request:
    paths:
      - 'workbench/static/**'
      - 'workbench/tests/*.cjs'
      - '.github/workflows/workbench-frontend-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: |
          node --check workbench/static/app.js
          node --check workbench/static/adapter.js
          node --check workbench/static/reviewer.js
          node --check workbench/tests/browser_e2e.mjs
      - name: Run every frontend DOM and transaction contract
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(workbench/tests/*.cjs)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo 'No Workbench frontend contract files were found.' >&2
            exit 1
          fi
          printf 'Executing %s Workbench frontend contract files:\n' "${#tests[@]}"
          printf ' - %s\n' "${tests[@]}"
          node --test "${tests[@]}"
