name: Evidence Workbench

on:
  push:
    branches: [main, 'feat/evidence-workbench', 'workbench/**']
    paths: ['workbench/**', '.github/workflows/workbench-ci.yml']
  pull_request:
    paths: ['workbench/**', '.github/workflows/workbench-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile isolated workbench
        run: python -m compileall -q workbench
      - name: Unit and real loopback integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p _review
          python -m unittest discover -s workbench/tests -v 2>&1 | tee _review/python-tests.txt
      - name: Check frontend JavaScript syntax
        run: node --check workbench/static/app.js
      - name: Frontend behavior contracts (DOM and fetch doubles, not browser E2E)
        shell: bash
        run: |
          set -o pipefail
          node --test workbench/tests/test_ollama_ui.cjs 2>&1 | tee _review/javascript-tests.txt
      - name: Prepare revision-bound source review bundle
        if: success() && matrix.python == '3.13'
        shell: bash
        run: |
          git archive --format=tar HEAD workbench .github/workflows/workbench-ci.yml LICENSE > _review/workbench-source.tar
          git rev-parse HEAD > _review/REVISION.txt
          (cd _review && sha256sum workbench-source.tar > SHA256SUMS)
          printf '%s\n' 'Review source for the exact checked-out revision, not a binary release or security certification.' 'This job passed compile, Python loopback/unit tests, JavaScript syntax and DOM/fetch-double tests.' 'No live Ollama inference, cloud request, external target, GPU test or browser E2E was performed.' 'See the other matrix jobs independently; this archive is produced by Python 3.13 only.' 'No root .env, reports, credentials, untracked runtime files or legacy installer are included.' > _review/VALIDATION.txt
      - name: Upload successful review bundle
        if: success() && matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench-review-${{ github.sha }}
          path: _review/
          if-no-files-found: error
          retention-days: 7

  # No external targets, real credentials, model downloads, legacy installer,
  # dependency installation or cloud inference are used by these tests.
